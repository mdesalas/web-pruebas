     form {

}

label {
  font-weight: bold;
}

input,
textarea {
  width: 100%;              /* Campo ocupa todo el ancho del formulario */
  padding: 10px;            /* Espacio interno */
  margin-top: 5px;          /* Espacio respecto al label */

  border-radius: 4px;       /* Bordes redondeados */
  font-size: 16px;
}

button {
  background-color: #0077cc;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 4px;
